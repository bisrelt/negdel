<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoPlay — Тоглоод хэл суръя</title>
<style>
:root{
  font-family:Arial,sans-serif;
  background:#f4f7f2;
  color:#213c2f;
}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:default}
header{ 
  background:#fff;
  padding:18px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #dce8dc;
}
.brand{
  font-weight:900;
  color:#246248;
  font-size:25px;
}
select,input{
  padding:12px;
  border-radius:12px;
  border:1px solid #d6e3d6;
  background:white;
  max-width:100%;
}
nav{
  background:white;
  padding:12px 5%;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
nav button{
  padding:11px 14px;
  border-radius:11px;
  background:#edf3ed;
  color:#436c52;
}
nav .active{background:#246248;color:white}
main{
  max-width:1050px;
  margin:auto;
  padding:22px 16px 70px;
}
h1,h2,h3,p{margin:0 0 12px}
h1{font-size:30px}
p{line-height:1.6}
.hero{
  background:#e2efdd;
  padding:30px;
  border-radius:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.hero h1{font-size:38px}
.frog{font-size:78px}
.muted{color:#6f8a75;font-size:13px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
  margin:17px 0;
}
.card{
  background:white;
  border:1px solid #e0e8dd;
  border-radius:17px;
  padding:18px;
  text-align:left;
  min-width:0;
}
.card strong{font-size:24px;display:block}
.card h3{font-size:17px}
.card p{font-size:14px;color:#69806d}
.primary,.secondary{
  padding:12px 17px;
  border-radius:11px;
  margin:6px 5px 6px 0;
}
.primary{background:#246248;color:white}
.secondary{background:#e8f1e5;color:#246248}
.lesson{min-height:142px}
.lesson.current{outline:2px solid #74a975}
.lesson.locked{opacity:.55}
.lesson small{
  display:block;
  margin-bottom:10px;
  color:#75987d;
}
.section{margin-top:26px}
.stat strong{font-size:28px}
.words{
  grid-template-columns:repeat(2,minmax(0,1fr));
}
.word{
  position:relative;
  padding-right:52px;
}
.word strong{overflow-wrap:anywhere}
.word button{
  position:absolute;
  top:14px;
  right:12px;
  background:#eff5ed;
  border-radius:10px;
  padding:9px;
}
.progress{
  background:#e2eae0;
  border-radius:50px;
  height:10px;
  overflow:hidden;
}
.progress div{
  height:100%;
  background:#7cac79;
}
.quiz{max-width:690px;margin:auto}
.question{
  font-size:37px;
  text-align:center;
  margin:22px 0;
  overflow-wrap:anywhere;
}
.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}
.option,.pair,.token{
  background:white;
  border:2px solid #dae6d8;
  padding:14px;
  border-radius:12px;
  min-height:55px;
}
.option.good,.pair.done{
  background:#dff1d8;
  border-color:#78ab78;
}
.option.bad{
  background:#fae3de;
  border-color:#d49c93;
}
.feedback{
  padding:16px;
  border-radius:14px;
  background:#e9f3e4;
  margin-top:16px;
}
.feedback.wrong{background:#f9eae5}
.match{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.match>div{display:grid;gap:9px}
.pair.selected{
  border-color:#8773ca;
  background:#f0edfa;
}
.pair.done{opacity:.55}
.tokens{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin:14px 0;
}
.answer-area{
  min-height:75px;
  border:2px dashed #a7c6a2;
  border-radius:13px;
  padding:12px;
}
.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}
.filters input{flex:2;min-width:180px}
.filters select{flex:1}
.badge{
  display:inline-block;
  background:#eaf2e2;
  padding:7px 11px;
  border-radius:20px;
  color:#47734d;
  font-size:12px;
}
.result{text-align:center}
.result .card{text-align:center}
.timer{
  padding:10px;
  background:#fff1db;
  border-radius:12px;
}
@media(max-width:680px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero h1{font-size:28px}
  .frog{font-size:52px}
  .card{padding:14px}
  .question{font-size:30px}
  nav button{padding:9px}
  header{padding:14px}
  nav{padding:12px}
}
@media(max-width:390px){
  .words{grid-template-columns:1fr}
  .hero{padding:18px}
  .hero h1{font-size:24px}
  .frog{font-size:45px}
}

/* LingoPlay colorful refresh: warm, playful, responsive and readable. */
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f8f3;
  color: #18382d;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --ink: #18382d;
  --green: #1f7655;
  --green-deep: #15523d;
  --mint: #dbf2e5;
  --lime: #c8ee82;
  --orange: #ffbd59;
  --pink: #ffdfd7;
  --line: #dfebe2;
  --shadow: 0 14px 40px rgba(31, 75, 54, .09);
}
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 8% 12%, rgba(207, 239, 215, .6), transparent 32rem),
    radial-gradient(ellipse at 94% 38%, rgba(255, 235, 198, .44), transparent 30rem),
    #f5f8f4;
  color: var(--ink);
}
button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid rgba(67, 159, 116, .42);
  outline-offset: 3px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
header {
  position: sticky; top: 0; z-index: 30;
  padding: 12px clamp(16px, 5vw, 72px);
  min-height: 76px;
  background: rgba(255,255,255,.88);
  border-bottom: 1px solid rgba(216,232,220,.9);
  box-shadow: 0 5px 22px rgba(27, 65, 46, .045);
  backdrop-filter: blur(16px);
}
.brand-wrap { display: flex; align-items: center; gap: 11px; min-width: max-content; }
.brand-mark {
  display: grid; place-items: center; width: 46px; height: 46px; border-radius: 16px;
  background: linear-gradient(145deg, #e1f6e6, #bbebce); font-size: 25px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
}
.brand { color: var(--green-deep); font-size: 21px; line-height: 1.05; letter-spacing: -.7px; font-weight: 900; }
.brand-sub { margin-top: 4px; color: #779083; font-size: 11px; font-weight: 650; letter-spacing: .02em; }
.header-tools { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
header select, select, input {
  border: 1px solid #dbe8de; border-radius: 14px; background: #fff; color: var(--ink);
  box-shadow: 0 3px 10px rgba(26,67,47,.04);
}
header select { padding: 10px 13px; font-weight: 700; }
nav {
  display: flex; justify-content: center; gap: 9px; flex-wrap: wrap;
  padding: 12px 16px; background: rgba(255,255,255,.55);
  border-bottom: 1px solid rgba(224,235,225,.75);
}
nav button {
  padding: 10px 15px; border: 1px solid transparent; border-radius: 999px;
  background: transparent; color: #648071; font-size: 14px; font-weight: 750;
  transition: color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
}
nav button:hover { background: #eaf5ed; color: var(--green-deep); transform: translateY(-1px); }
nav .active { background: var(--green-deep); color: #fff; box-shadow: 0 7px 16px rgba(21,82,61,.2); }
nav .active:hover { background: #1e684b; color: #fff; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 18px 76px; }
h1, h2, h3, p { margin-top: 0; }
h1 { color: var(--ink); font-size: clamp(27px, 4vw, 38px); letter-spacing: -.04em; line-height: 1.15; }
h2 { color: var(--ink); letter-spacing: -.025em; }
h3 { color: #244b39; }
p { color: #61786b; line-height: 1.65; }
.section { margin-top: 34px; }
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  min-height: 250px; padding: clamp(26px, 5vw, 48px);
  border: 1px solid rgba(255,255,255,.55); border-radius: 30px;
  background: linear-gradient(122deg, #15523d 0%, #237b57 58%, #52a877 100%);
  color: #fff; box-shadow: 0 20px 45px rgba(30,100,67,.2);
}
.hero::before, .hero::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; }
.hero::before { width: 310px; height: 310px; right: 10%; top: -205px; border: 1px solid rgba(255,255,255,.17); box-shadow: 0 0 0 28px rgba(255,255,255,.035), 0 0 0 58px rgba(255,255,255,.025); }
.hero::after { width: 190px; height: 190px; right: 26%; bottom: -145px; background: rgba(195,239,153,.13); }
.hero > div { position: relative; z-index: 1; max-width: 690px; }
.hero h1 { max-width: 650px; color: white; font-size: clamp(32px, 5vw, 48px); margin: 14px 0 10px; }
.hero p { max-width: 490px; color: rgba(255,255,255,.82); font-size: 16px; margin-bottom: 20px; }
.hero .badge { color: #e7ffd9; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); }
.hero .primary { background: var(--lime); color: #214a32; box-shadow: 0 8px 18px rgba(9,45,30,.16); }
.hero .primary:hover { background: #d7f8a0; }
.frog {
  position: relative; z-index: 1; display: grid; place-items: center;
  width: clamp(96px, 15vw, 148px); height: clamp(96px, 15vw, 148px); flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.22); border-radius: 42px;
  background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 15px 30px rgba(12,57,36,.14);
  font-size: clamp(55px, 8vw, 82px); transform: rotate(4deg);
}
.grid { gap: 15px; margin: 18px 0 22px; }
.card {
  border: 1px solid rgba(219,232,221,.95); border-radius: 21px; padding: 20px;
  background: rgba(255,255,255,.94); box-shadow: 0 8px 25px rgba(34,75,53,.055);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
button.card:hover { transform: translateY(-3px); border-color: #acd8b8; box-shadow: var(--shadow); }
.stat { position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; width: 62px; height: 62px; right: -20px; bottom: -24px; border-radius: 50%; background: #edf8ec; }
.stat strong { position: relative; z-index: 1; color: var(--green-deep); font-size: 30px; letter-spacing: -.04em; }
.stat p { position: relative; z-index: 1; margin-bottom: 0; font-size: 13px; font-weight: 650; }
.primary, .secondary {
  display: inline-flex; justify-content: center; align-items: center; gap: 7px;
  padding: 12px 18px; border: 0; border-radius: 13px; font-weight: 800;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.primary { background: var(--green); color: #fff; box-shadow: 0 6px 15px rgba(31,118,85,.16); }
.primary:hover { background: var(--green-deep); transform: translateY(-1px); box-shadow: 0 9px 19px rgba(31,118,85,.22); }
.secondary { background: #eaf5ec; color: var(--green-deep); }
.secondary:hover { background: #dcefe1; transform: translateY(-1px); }
.lesson { min-height: 156px; border: 1px solid #e2ece2; color: inherit; }
.lesson.current { outline: 0; border-color: #8dc79f; background: linear-gradient(150deg,#fff,#f3fbf3); box-shadow: inset 0 0 0 1px #bfe2c7, 0 8px 24px rgba(40,105,65,.08); }
.lesson.locked { opacity: .62; filter: saturate(.72); }
.lesson small { color: #789482; font-weight: 750; letter-spacing: .025em; }
.lesson h3 { margin-bottom: 7px; }
.lesson p { margin-bottom: 9px; }
.words { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.word { border-radius: 17px; }
.word strong { color: #194a37; font-size: 20px; }
.word p { margin: 5px 0 0; }
.word button { display: grid; place-items: center; width: 39px; height: 39px; top: 13px; right: 13px; border: 1px solid #e3eee5; background: #f0f8f1; transition: transform .18s ease, background .18s ease; }
.word button:hover { background: #e0f2e4; transform: scale(1.06); }
.progress { height: 11px; background: #edf3ec; }
.progress div { border-radius: inherit; background: linear-gradient(90deg, #68bd82, #b7d96b); transition: width .35s ease; }
.quiz { max-width: 740px; }
.question { margin: 24px 0; color: var(--green-deep); font-size: clamp(30px, 5vw, 42px); }
.options { gap: 12px; }
.option, .pair, .token { border: 1px solid #dfeae1; border-radius: 15px; background: #fff; color: #294b3a; font-weight: 700; transition: transform .17s ease, border-color .17s ease, background .17s ease; }
.option:hover, .pair:hover, .token:hover { border-color: #9dcdaa; transform: translateY(-1px); }
.option.good, .pair.done { border-color: #82c58f; background: #eaf8e8; color: #246b42; }
.option.bad { border-color: #e2a69a; background: #fff0eb; color: #945042; }
.feedback { border: 1px solid #d5e9d7; border-radius: 17px; background: #eff9ed; color: #234c34; }
.feedback.wrong { border-color: #f0d1c9; background: #fff2ed; }
.pair.selected { border-color: #8a76d1; background: #f2efff; }
.badge { border: 1px solid #deeddc; background: #edf7e8; color: #427050; font-weight: 800; }
.timer { display: inline-flex; border: 1px solid #f2dfb9; background: #fff6e6; color: #865817; font-weight: 850; }
.result .card { text-align: center; }
.filters input, .filters select { padding: 13px 15px; }
input:focus, select:focus { border-color: #8bc39a; box-shadow: 0 0 0 4px rgba(98,171,116,.12); outline: none; }
.google-slot { min-width: 210px; min-height: 40px; display: flex; justify-content: flex-end; align-items: center; }
.google-fallback {
  min-height: 40px; padding: 8px 13px; border: 1px solid #d9e4dc; border-radius: 12px;
  background: #fff; color: #345242; font-size: 13px; font-weight: 750;
  box-shadow: 0 3px 10px rgba(26,67,47,.04);
}
.google-fallback:hover { background: #f7faf7; border-color: #b9d5c0; }
.auth-note { max-width: 205px; margin: 4px 0 0; color: #899b8e; font-size: 10px; line-height: 1.35; text-align: right; }
.toast {
  position: fixed; z-index: 100; left: 50%; bottom: 22px; max-width: min(540px, calc(100vw - 32px));
  padding: 13px 17px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px;
  background: #183c2e; color: #fff; box-shadow: 0 12px 32px rgba(13,47,31,.23);
  font-size: 14px; line-height: 1.5; transform: translate(-50%, 18px); opacity: 0;
  pointer-events: none; transition: opacity .22s ease, transform .22s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 720px) {
  header { align-items: flex-start; gap: 12px; padding: 11px 14px; }
  .header-tools { flex-wrap: wrap; gap: 7px; }
  .google-slot { min-width: 0; }
  .brand-sub { display: none; }
  nav { justify-content: flex-start; padding: 10px 12px; gap: 5px; }
  nav button { padding: 9px 12px; font-size: 13px; }
  main { padding: 21px 14px 60px; }
  .hero { min-height: 220px; border-radius: 23px; }
  .hero .frog { margin-left: auto; }
  .grid { gap: 11px; }
  .card { padding: 16px; border-radius: 18px; }
  .lesson { min-height: 145px; }
}
@media (max-width: 520px) {
  header { position: relative; align-items: center; flex-wrap: wrap; }
  .brand-mark { width: 40px; height: 40px; border-radius: 14px; font-size: 22px; }
  .brand { font-size: 19px; }
  .header-tools { width: 100%; justify-content: space-between; }
  .google-slot { min-height: 38px; }
  nav { overflow-x: auto; flex-wrap: nowrap; }
  nav button { flex: 0 0 auto; }
  .hero { align-items: flex-start; gap: 8px; padding: 23px 19px; }
  .hero h1 { max-width: 290px; font-size: 30px; }
  .hero p { max-width: 260px; font-size: 14px; }
  .frog { width: 66px; height: 66px; margin-top: 12px; border-radius: 22px; font-size: 39px; }
  .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .words { grid-template-columns: 1fr; }
  .options { grid-template-columns: 1fr; }
  .question { font-size: 29px; }
  .auth-note { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

</style>
</head>

  s.lang=["en","ko"].includes(raw.lang)
    ?raw.lang:"en";

  for(const k of ["xp","rounds","correct","streak"]){
    s[k]=Math.max(0,Number(raw[k])||0);
  }

  s.lastPlay=typeof raw.lastPlay==="string"
    ?raw.lastPlay:null;

  s.learned=Array.isArray(raw.learned)
    ?raw.learned:[];

  for(const lang of ["en","ko"]){
    s.completed[lang]=(raw.completed?.[lang]||[])
      .map(v=>typeof v==="number"?v:IDS.indexOf(v))
      .filter(v=>
        Number.isInteger(v)&&v>=0&&v<25
      );
  }
  return s;
}

let clock=null;

const screen=document.getElementById("screen");

const esc=s=>String(s).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

const shuffle=a=>[...a].sort(()=>Math.random()-.5);

const words=()=>COURSES[state.lang]

const done=i=>state.completed[state.lang].includes(i);

function handleGoogleCredential(response) {
  // Never persist the credential in localStorage or treat a client-only callback as verified.
  if (!response || !response.credential) {
    showToast("Google нэвтрэлтийн хариу ирсэнгүй. Дахин оролдоно уу.");

  showToast("Google-ээс хариу ирлээ. Жинхэнэ нэвтрэлт ба ахиц синк хийхийн тулд серверийн баталгаажуулалт холбоно уу.");
}

const MODES=[
  ["quiz","🎯 Үгийн сорил","Зөв утгыг сонгох"],
  ["match","🧩 Хос олох","Үг, утгыг хослуулах"],
  ["sentence","🧱 Өгүүлбэр эвлүүлэх","Үгсийг зөв дараалах"],
  ["sprint","⚡ Хурдны сорил","45 секундын сорил"]
];

function gameCards(){
  return `
  <div class="grid words">
    ${MODES.map(m=>`
      <button
        class="card"
        onclick="startGame('${m[0]}')"
      >
        <h3>${m[1]}</h3>
        <p>${m[2]}</p>
      </button>
    `).join("")}
  </div>`;
}

function wordCard(w){
  return `
  <div class="card word">
    <strong>${esc(w.word)}</strong>
    <p>${esc(w.mn)}</p>
    ${state.learned.includes(w.id)
      ?'<small>✅ Сурсан</small>':''}
    <button onclick="speak('${w.id}')">
      🔊
    </button>
  </div>`;
}

function openLesson(i){
  if(!open(i)){
    alert("Өмнөх level-ийг 70%-тай давж нээнэ.");
    return;
  }

  const l=COURSES[state.lang][i];
  if(!l)return;

  screen.innerHTML=`
    <button class="secondary" onclick="go('lessons')">
      ← Буцах
    </button>

    <h1>Level ${i+1}: ${esc(l.title)}</h1>

    <p>
      ${l.words.length} шинэ үгийг уншиж,
      сонсоод сорилоо өгөөрэй.
    </p>

    <div class="grid words">
      ${l.words.map(wordCard).join("")}
    </div>

    <button
      class="primary"
      onclick="startGame('quiz',${i})"
    >
      🎯 Level ${i+1}-ийн сорил эхлэх →
    </button>
  `;

  window.scrollTo(0,0);
}

function filterWords(){
  const q=document.getElementById("search")
    .value.trim().toLowerCase();

  const t=document.getElementById("topic").value;

  const list=words().filter(w=>
    (t==="all"||w.level===Number(t))&&
    (
      w.word.toLowerCase().includes(q)||
      w.mn.toLowerCase().includes(q)
    )
  );

  document.getElementById("wordCount")
    .textContent=`${list.length} үг`;

  document.getElementById("wordList").innerHTML=
    list.length
      ?list.map(wordCard).join("")
      :'<p>Үг олдсонгүй.</p>';
}

function speak(id){
  const w=words().find(w=>w.id===id);
  if(!w)return;

  if(!("speechSynthesis" in window)){
    alert("Энэ браузер дуудлага дэмжихгүй байна.");
    return;
  }

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(w.word);
  u.lang=state.lang==="en"?"en-US":"ko-KR";
  u.rate=.85;

  speechSynthesis.speak(u);
}

function availableWords(){
  const last=COURSES[state.lang].findIndex(
    (l,i)=>!done(i)
  );

  return COURSES[state.lang]
    .slice(0,last===-1?25:last+1)
    .flatMap(l=>l.words);
}

function makeQuestion(w,pool){
  const others=[
    ...new Set(
      pool.filter(x=>x.mn!==w.mn).map(x=>x.mn)
    )
  ];

  return {
    word:w,
    answer:w.mn,
    options:shuffle([
      w.mn,
      ...shuffle(others).slice(0,3)
    ])
  };
}

function startGame(mode,level=null){
  clearInterval(clock);
  clock=null;

  if(level!==null&&!open(level))return;

  const pool=level===null
    ?availableWords()
    :COURSES[state.lang][level].words;

  game={
    mode,
    level,
    pool,
    index:0,
    correct:0,
    attempts:0,
    learned:[],
    answered:false,
    finished:false
  };

  if(mode==="quiz"||mode==="sprint"){
    game.questions=shuffle(pool)
      .slice(
        0,
        mode==="quiz"
          ?(level===null?10:pool.length)
          :pool.length
      )
      .map(w=>makeQuestion(w,pool));

    if(mode==="sprint"){
      game.end=Date.now()+45000;

      clock=setInterval(()=>{
        if(!game||game.finished)return;

        const el=document.getElementById("seconds");

        if(el){
          el.textContent=Math.max(
            0,
            Math.ceil((game.end-Date.now())/1000)
          )+" сек";
        }

        if(Date.now()>=game.end){
          finishGame();
        }
      },200);
    }
  }
  else if(mode==="match"){
    game.pairs=shuffle([
      ...new Map(
        pool.map(w=>[w.mn,w])
      ).values()
    ]).slice(0,6);

    game.right=shuffle(game.pairs);
    game.matched=[];
    game.left=null;
    game.rightPick=null;
  }
  else if(mode==="sentence"){
    game.questions=shuffle(
      SENTENCES[state.lang]
    ).slice(0,5);

    prepareSentence();
  }
  else{
    return;
  }

  renderGame();
  window.scrollTo(0,0);
}

function prepareSentence(){
  game.selected=[];

  game.order=shuffle(
    game.questions[game.index][1].map((_,i)=>i)
  );
}

function gameTitle(){
  const title=MODES.find(
    m=>m[0]===game.mode
  )?.[1]||"Тоглоом";

  const total=game.mode==="match"
    ?game.pairs.length
    :game.questions.length;

  const current=game.mode==="match"
    ?game.matched.length
    :game.index;

  return `
    <button class="secondary" onclick="go('games')">
      ← Тоглоом
    </button>

    <h2>
      ${title}
      ${game.level!==null
        ?` · Level ${game.level+1}`:""}
    </h2>

    ${game.mode==="sprint"
      ?'<span class="timer" id="seconds">45 сек</span>'
      :`
        <p>${Math.min(current+1,total)} / ${total}</p>
        ${bar(current,total)}
      `}
  `;
}

function renderGame(){
  if(!game||game.finished)return;

  if(game.mode==="match"){
    return renderMatch();
  }

  if(game.mode==="sentence"){
    return renderSentence();
  }

  const q=game.questions[game.index];
  if(!q)return finishGame();

  screen.innerHTML=`
  <div class="quiz">
    ${gameTitle()}

    <div class="card">
      <p class="muted" style="text-align:center">
        Энэ үгийн Монгол утгыг сонго:
      </p>

      <h1 class="question">
        ${esc(q.word.word)}
      </h1>

      <div class="options">
        ${q.options.map((o,i)=>`
          <button
            class="option ${
              game.answered&&o===q.answer
                ?"good"
                :game.answered&&o===game.choice
                  ?"bad":""
            }"
            onclick="answer(${i})"
            ${game.answered?"disabled":""}
          >
            ${esc(o)}
          </button>
        `).join("")}
      </div>
    </div>

    ${game.answered?`
      <div class="feedback ${
        game.choice===q.answer?"":"wrong"
      }">
        <b>
          ${game.choice===q.answer
            ?"✅ Зөв хариуллаа!"
            :"🌱 Зөв хариулт:"}
        </b>

        ${esc(q.answer)}

        <div>
          <button
            class="primary"
            onclick="nextQuestion()"
          >
            Үргэлжлүүлэх →
          </button>
        </div>
      </div>
    `:""}
  </div>`;
}

// ХАРИУЛТ ШАЛГАХ
function answer(i){
  if(!game||game.answered||game.finished)return;

  if(
    game.mode==="sprint"&&
    Date.now()>=game.end
  ){
    return finishGame();
  }

  const q=game.questions[game.index];

  if(!q||q.options[i]===undefined)return;

  game.choice=q.options[i];
  game.answered=true;
  game.attempts++;

  if(game.choice===q.answer){
    game.correct++;
    game.learned.push(q.word.id);
  }

  renderGame();
}

function nextQuestion(){
  if(!game||!game.answered||game.finished)return;

  game.index++;
  game.answered=false;
  game.choice=null;

  if(game.index>=game.questions.length){
    if(game.mode==="sprint"){
      game.questions=shuffle(game.pool)
        .map(w=>makeQuestion(w,game.pool));
      game.index=0;
    }
    else{
      return finishGame();
    }
  }

  if(game.mode==="sentence"){
    prepareSentence();
  }

  renderGame();
}

function renderMatch(){
  screen.innerHTML=`
  <div class="quiz">
    ${gameTitle()}

    <p>
      Зүүн талаас үг, баруун талаас утгыг нь сонго.
    </p>

    <div class="match">
      <div>
        ${game.pairs.map((w,i)=>`
          <button
            class="pair ${
              game.matched.includes(w.id)
                ?"done"
                :game.left===i?"selected":""
            }"
            onclick="pickPair('left',${i})"
            ${game.matched.includes(w.id)
              ?"disabled":""}
          >
            ${esc(w.word)}
          </button>
        `).join("")}
      </div>

      <div>
        ${game.right.map((w,i)=>`
          <button
            class="pair ${
              game.matched.includes(w.id)
                ?"done"
                :game.rightPick===i?"selected":""
            }"
            onclick="pickPair('right',${i})"
            ${game.matched.includes(w.id)
              ?"disabled":""}
          >
            ${esc(w.mn)}
          </button>
        `).join("")}
      </div>
    </div>

    ${game.matched.length===game.pairs.length
      ?`
        <button class="primary" onclick="finishGame()">
          Үр дүнгээ харах →
        </button>
      `:""}
  </div>`;
}

function pickPair(side,i){
  if(!game||game.finished||game.mode!=="match")return;

  const list=side==="left"
    ?game.pairs
    :game.right;

  if(!list[i]||game.matched.includes(list[i].id)){
    return;
  }

  if(side==="left"){
    game.left=i;
  }
  else{
    game.rightPick=i;
  }

  if(game.left!==null&&game.rightPick!==null){
    const left=game.pairs[game.left];
    const right=game.right[game.rightPick];

    game.attempts++;

    if(left.id===right.id){
      game.correct++;
      game.matched.push(left.id);
      game.learned.push(left.id);
    }

    game.left=null;
    game.rightPick=null;
  }

  renderMatch();
}

function renderSentence(){
  const [mn,tokens]=game.questions[game.index];

  screen.innerHTML=`
  <div class="quiz">
    ${gameTitle()}

    <div class="card">
      <p style="text-align:center">
        Үгсийг зөв дарааллаар эвлүүл:
      </p>

      <h2 style="text-align:center">
        ${esc(mn)}
      </h2>

      <div class="tokens answer-area">
        ${game.selected.map(i=>`
          <button
            class="token"
            onclick="removeToken(${i})"
            ${game.answered?"disabled":""}
          >
            ${esc(tokens[i])}
          </button>
        `).join("")}
      </div>

      <div class="tokens">
        ${game.order
          .filter(i=>!game.selected.includes(i))
          .map(i=>`
            <button
              class="token"
              onclick="addToken(${i})"
              ${game.answered?"disabled":""}
            >
              ${esc(tokens[i])}
            </button>
          `).join("")}
      </div>

      ${!game.answered?`
        <button
          class="primary"
          onclick="checkSentence()"
          ${game.selected.length!==tokens.length
            ?"disabled":""}
        >
          Шалгах ✓
        </button>
      `:""}
    </div>

    ${game.answered?`
      <div class="feedback ${
        game.wasCorrect?"":"wrong"
      }">
        ${game.wasCorrect
          ?"✅ Зөв!"
          :"🌱 Зөв өгүүлбэр:"}

        <p><b>${esc(tokens.join(" "))}</b></p>

        <button
          class="primary"
          onclick="nextQuestion()"
        >
          Үргэлжлүүлэх →
        </button>
      </div>
    `:""}
  </div>`;
}

function addToken(i){
  if(
    !game||
    game.mode!=="sentence"||
    game.answered||
    game.selected.includes(i)
  )return;

  game.selected.push(i);
  renderSentence();
}

function removeToken(i){
  if(
    !game||
    game.mode!=="sentence"||
    game.answered
  )return;

  game.selected=game.selected.filter(x=>x!==i);
  renderSentence();
}

function checkSentence(){
  if(
    !game||
    game.mode!=="sentence"||
    game.answered
  )return;

  const tokens=game.questions[game.index][1];

  if(game.selected.length!==tokens.length)return;

  game.wasCorrect=game.selected.every(
    (x,i)=>x===i
  );

  game.answered=true;
  game.attempts++;

  if(game.wasCorrect){
    game.correct++;
  }

  renderSentence();
}

function finishGame(){
  if(!game||game.finished)return;

  game.finished=true;
  clearInterval(clock);
  clock=null;

  const total=
    game.mode==="quiz"||game.mode==="sentence"
      ?game.questions.length
      :game.attempts;

  const score=total
    ?Math.round(game.correct*100/total)
    :0;

  const passed=total>0&&score>=70;

  const gained=
    game.correct*10+(passed?20:0);

  state.xp+=gained;
  state.correct+=game.correct;
  state.rounds++;

  state.learned=[
    ...new Set([
      ...state.learned,
      ...game.learned
    ])
  ];

  if(
    passed&&
    game.level!==null&&
    !done(game.level)
  ){
    state.completed[state.lang].push(game.level);
  }

  const today=new Date().toLocaleDateString(
    "en-CA",
    {timeZone:"Asia/Ulaanbaatar"}
  );

  if(state.lastPlay!==today){
    const difference=state.lastPlay
      ?(Date.parse(today)-Date.parse(state.lastPlay))/86400000
      :99;

    state.streak=difference===1
      ?state.streak+1
      :1;

    state.lastPlay=today;
  }

  save();

  const mode=game.mode;
  const level=game.level;

  screen.innerHTML=`
  <div class="result">
    <h1>
      ${passed
        ?"🏆 Маш сайн!"
        :"🌱 Дахин оролдоорой!"}
    </h1>

    <p>${score}% зөв · +${gained} XP</p>

    <div class="grid">
      ${stats(game.correct+"/"+total,"Зөв хариулт")}
      ${stats(state.xp,"Нийт XP")}
      ${stats(
        Math.floor(state.xp/150)+1,
        "XP Level"
      )}
    </div>

    ${level!==null?`
      <p>
        ${passed
          ?"✅ Дараагийн level нээгдлээ!"
          :"70% хүрвэл дараагийн level нээгдэнэ."}
      </p>
    `:""}

    <button
      class="secondary"
      onclick="startGame('${mode}',${level===null?"null":level})"
    >
      Дахин тоглох
    </button>

    <button
      class="primary"
      onclick="go('lessons')"
    >
      Level-үүд →
    </button>
  </div>`;
}

function showProgress(){
  const level=Math.floor(state.xp/150)+1;
  const cur=state.xp%150;

  screen.innerHTML=`
  <h1>⭐ Миний ахиц</h1>

  <div class="grid">
    ${stats(state.xp,"Нийт XP")}
    ${stats(state.correct,"Нийт зөв")}
    ${stats(state.rounds,"Тоглосон удаа")}
  </div>

  <div class="card">
    <h2>XP Level ${level}</h2>
    <p>
      ${cur}/150 XP · Дараагийн түвшин хүртэл
      ${150-cur} XP
    </p>
    ${bar(cur,150)}
  </div>

  <h2 class="section">Хичээлийн ахиц</h2>

  <div class="grid words">
    ${["en","ko"].map(lang=>`
      <div class="card">
        <h3>
          ${lang==="en"
            ?"🇬🇧 Англи"
            :"🇰🇷 Солонгос"}
        </h3>
        <p>
          ${state.completed[lang].length}/25 level
        </p>
        ${bar(state.completed[lang].length,25)}
      </div>
    `).join("")}
  </div>

  <h2 class="section">🏅 Амжилтын тэмдэг</h2>

  <div class="grid">
    ${[
      ["Анхны тоглоом",state.rounds>=1],
      ["20 үг",state.learned.length>=20],
      ["100 XP",state.xp>=100],
      ["Тууштай сурагч",state.streak>=3],
      ["10 Level",Math.max(
        state.completed.en.length,
        state.completed.ko.length
      )>=10],
      ["25 Level",Math.max(
        state.completed.en.length,
        state.completed.ko.length
      )>=25]
    ].map(([name,earned])=>`
      <div class="card">
        ${earned?"🏅":"🔒"}
        <h3>${name}</h3>
      </div>
    `).join("")}
  </div>

  <p class="muted">
    Ахиц таны энэ браузер дээр хадгалагдана.
  </p>`;
}
go("home");
</script>
</body>
</html>
